name: Project Hub CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: project-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Repository boundaries and required documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Verify project-hub structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -d backend
          test ! -d frontend
          test -f README.md
          test -f docs/REPOSITORIES.md
          test -f docs/STACK.md
          test -f docs/BACKLOG-AND-STORIES.md
          test -f aidlc-docs/audit.md
          test -f compose.yaml
          test -f tool/local_stack.ps1
      - name: Reject committed local secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A real .env file must never be committed."
            exit 1
          fi
      - name: Check patch whitespace
        run: git diff --check HEAD^
