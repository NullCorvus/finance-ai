name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: finance_ai_test
          POSTGRES_USER: finance_ai
          POSTGRES_PASSWORD: change-me-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ai -d finance_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FINANCE_AI_ENVIRONMENT: test
      FINANCE_AI_DATABASE_URL: postgresql+psycopg://finance_ai:change-me-ci@127.0.0.1:5432/finance_ai_test
      FINANCE_AI_TEST_DATABASE_URL: postgresql+psycopg://finance_ai:change-me-ci@127.0.0.1:5432/finance_ai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and project Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Resolve locked dependencies
        run: uv sync --all-groups --frozen

      - name: Format, lint, and type-check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src

      - name: Verify migration, seed, and model drift
        run: |
          uv run alembic upgrade head
          uv run python -m finance_ai.db.seeds
          uv run alembic check

      - name: Verify generated API contract is current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

      - name: Run all backend tests with coverage
        run: uv run pytest --cov=finance_ai --cov-report=term-missing

      - name: Audit locked Python dependencies
        run: uv run pip-audit

  flutter:
    name: Flutter quality and Android build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install checksum-verified Flutter 3.47.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.47.2-stable.tar.xz"
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz" \
            --output "$archive"
          echo "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185  $archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve locked Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze

      - name: Run Flutter tests and enforce coverage
        shell: bash
        run: |
          flutter test --coverage
          awk -F: '
            /^LF:/{found += $2}
            /^LH:/{hit += $2}
            END {
              coverage = found == 0 ? 0 : (100 * hit / found)
              printf "Flutter line coverage: %.2f%%\n", coverage
              if (coverage < 80) exit 1
            }
          ' coverage/lcov.info

      - name: Build debug Android APK
        run: flutter build apk --debug

  flutter-windows:
    name: Flutter Windows smoke test and build
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install checksum-verified Flutter 3.47.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_3.47.2-stable.zip"
          Invoke-WebRequest `
            -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.2-stable.zip" `
            -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = "37934f2128a55d77a38baba12fd611157ed23a47bf7d2b7d17e9e84da118409d"
          if ($actualHash -ne $expectedHash) {
            throw "Flutter archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "flutter\bin")

      - name: Resolve locked Flutter dependencies
        shell: pwsh
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Format and analyze shared client
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze

      - name: Run native Windows auth and secure-storage smoke tests
        shell: pwsh
        run: .\tool\test_windows_and_restore.ps1
