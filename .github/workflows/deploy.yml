# ──────────────────────────────────────────────
# Finance AI Tracker — CI/CD Pipeline
# ──────────────────────────────────────────────
# Triggers:
#   - Push to main → run tests + deploy to Azure VM
#   - PR → run tests only
# ──────────────────────────────────────────────
name: Deploy to Azure VM

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BACKEND_DIR: finance-ai-backend

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance_ai
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: finance_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups

      - name: Run linter (ruff)
        run: uv run ruff check src tests

      - name: Run type checker (mypy)
        run: uv run mypy src

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term --cov-fail-under=80
        env:
          FINANCE_AI_ENVIRONMENT: test
          FINANCE_AI_DATABASE_URL: postgresql+psycopg://finance_ai:ci-test-password@localhost:5432/finance_ai

  deploy:
    name: Deploy to Azure VM
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-group  # Prevents concurrent deployments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Pulling latest code ==="
            cd /opt/finance-ai
            sudo -u finance-ai git pull --ff-only origin main

            echo "=== Syncing dependencies ==="
            cd /opt/finance-ai/finance-ai-backend
            sudo -u finance-ai uv sync --frozen --no-dev

            echo "=== Running database migrations ==="
            sudo -u finance-ai .venv/bin/alembic upgrade head

            echo "=== Restarting backend ==="
            sudo systemctl restart finance-ai-backend

            echo "=== Health check ==="
            sleep 3
            curl -fsS http://127.0.0.1:8000/health/live && echo " [OK]" || echo " [WARN] Health check failed"