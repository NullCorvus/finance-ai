# ──────────────────────────────────────────────
# Finance AI Tracker — Nginx reverse proxy
# ──────────────────────────────────────────────
# Install: sudo ln -sf /opt/finance-ai/deploy/nginx.conf /etc/nginx/sites-available/finance-ai
#          sudo ln -sf /etc/nginx/sites-available/finance-ai /etc/nginx/sites-enabled/
# Then run: sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS via Certbot (replace example.com with your domain):
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# ──────────────────────────────────────────────

upstream finance-ai-backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect (enable after Certbot) ──
server {
    listen 80;
    server_name _;

    # Initially serve HTTP; Certbot converts this to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Comment this redirect AFTER running certbot
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;  # Replace with your domain after Certbot

    # SSL — Certbot fills these after setup
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;

    # Harden SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Request size — limit to 16 KB body, but larger for receipt images
    client_max_body_size 10M;

    # ── API reverse proxy ──
    location / {
        proxy_pass http://finance-ai-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Receipt images ──
    location /receipts/ {
        alias /opt/finance-ai/receipts/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health endpoint (no caching) ──
    location /health/ {
        proxy_pass http://finance-ai-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    access_log /var/log/nginx/finance-ai-access.log;
    error_log  /var/log/nginx/finance-ai-error.log;
}